<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Jitendra Singh Malik" />
    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="iu2qKtE0HgiLy5KqXLduqEjYwNyHTdII24nNgrU6EL4" />
    <!-- Generic crawl directives — safe to be global -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="bingbot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@fabricprep" />
    <!--
      Per-page tags (title, description, keywords, canonical, og:title,
      og:description, og:url) are set by each route via PageSeo/<Head> — see
      src/components/PageSeo.jsx. A static one here would conflict: a static
      canonical pointing at "/" once told Google every page was a duplicate
      of the homepage.

      The tags below are the exception — identical on every route, so no page
      sets them. No og:image:width/height on purpose: og-image.png is 446x228,
      under the 1200x630 social platforms want, so declaring its real size
      would lock in a small card. Undeclared, each platform measures the file,
      and re-exporting it at 1200x630 (og-image-template.html) upgrades every
      card with no code change.
    -->
    <meta property="og:site_name" content="FabricPrep" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://fabricprep.com/og-image.png" />
    <meta property="og:image:alt" content="FabricPrep — free Microsoft Fabric and Azure certification practice questions" />
    <meta name="twitter:image" content="https://fabricprep.com/og-image.png" />
    <!-- PWA / Mobile -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="application-name" content="FabricPrep" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FabricPrep" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1E6FCC" />
    <!-- Icons - Optimized for Google Search -->
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

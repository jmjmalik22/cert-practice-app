<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Jitendra Singh Malik" />
    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="iu2qKtE0HgiLy5KqXLduqEjYwNyHTdII24nNgrU6EL4" />
    <!-- Generic crawl directives — safe to be global -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="bingbot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      NOTE: title, description, keywords, canonical, and og:* tags are
      intentionally NOT set here. Every route sets these itself via
      <Head>/<Helmet> in its page component (see src/pages/**/*.jsx).
      A static tag here would duplicate and conflict with each page's own
      tag — in particular a static canonical pointing at "/" told search
      engines every single page (including every exam and study guide
      page) was just a duplicate of the homepage.
    -->
    <!-- PWA / Mobile -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="application-name" content="FabricPrep" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FabricPrep" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#3b82f6" />
    <!-- Icons - Optimized for Google Search -->
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
